services:
  node:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: '${UID:-1000}:${GID:-1000}'
    init: true
    environment:
      HOME: /tmp
      CI: ${CI:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    user: '${UID:-1000}:${GID:-1000}'
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/app

volumes:
  node_modules:
